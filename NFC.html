<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Profile & Services</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Padauk -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Padauk', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex items-center justify-center p-4">

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full opacity-0 transition-all duration-300 bg-emerald-600 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 border border-emerald-500">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage" class="text-sm font-medium">အောင်မြင်ပါသည်</span>
    </div>

    <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Settings Toggle Button (Admin Trigger) -->
        <button onclick="toggleSettingsModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors p-2 z-20" title="Settings">
            <i class="fa-solid fa-gear text-lg"></i>
        </button>

        <!-- Glow Effect Background -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Profile Header Section -->
        <div class="text-center relative z-10 mb-8">
            <div class="relative inline-block mb-4">
                <img id="profileImage" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="Profile" 
                     class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover border-2 border-blue-400 shadow-lg mx-auto">
                <span class="absolute bottom-1 right-1 bg-emerald-500 w-4 h-4 rounded-full border-2 border-slate-900" title="Active"></span>
            </div>
            <h1 id="profileName" class="text-2xl font-bold tracking-wide text-white">Mg Jen</h1>
            <p id="profileBio" class="text-sm text-slate-400 mt-1">Digital Creator & Developer</p>
        </div>

        <!-- Social Links & Services Action Buttons -->
        <div class="space-y-4 relative z-10">
            
            <!-- Facebook Button -->
            <a id="fbLink" href="#" target="_blank" rel="noopener noreferrer"
               class="flex items-center justify-between w-full p-4 rounded-xl bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/30 transition-all duration-300 group shadow-md hover:scale-[1.02]">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center text-white shadow-md group-hover:rotate-6 transition-transform">
                        <i class="fa-brands fa-facebook-f text-lg"></i>
                    </div>
                    <span class="font-semibold text-slate-200">Facebook အကောင့်</span>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-400 group-hover:translate-x-1 transition-transform"></i>
            </a>

            <!-- TikTok Button -->
            <a id="tiktokLink" href="#" target="_blank" rel="noopener noreferrer"
               class="flex items-center justify-between w-full p-4 rounded-xl bg-slate-800/40 hover:bg-slate-800/60 border border-slate-700/50 transition-all duration-300 group shadow-md hover:scale-[1.02]">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-lg bg-black flex items-center justify-center text-white shadow-md border border-slate-700 group-hover:rotate-6 transition-transform">
                        <i class="fa-brands fa-tiktok text-lg"></i>
                    </div>
                    <span class="font-semibold text-slate-200">TikTok အကောင့်</span>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-400 group-hover:translate-x-1 transition-transform"></i>
            </a>

            <!-- Divider -->
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-700/60"></div>
                <span class="flex-shrink mx-4 text-xs text-slate-500 uppercase tracking-widest">Services</span>
                <div class="flex-grow border-t border-slate-700/60"></div>
            </div>

            <!-- POS Services Button -->
            <button onclick="navigateToPOS()" 
                    class="flex items-center justify-between w-full p-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold shadow-lg shadow-blue-500/20 transition-all duration-300 hover:scale-[1.02] active:scale-[0.98]">
                <div class="flex items-center space-x-4">
                    <div class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center text-white shadow-inner">
                        <i class="fa-solid fa-store text-lg"></i>
                    </div>
                    <span>ကျုပ်စီမှာရနိုင်သော ဝန်ဆောင်မှုများ (POS)</span>
                </div>
                <i class="fa-solid fa-arrow-right-long group-hover:translate-x-1 transition-transform"></i>
            </button>

        </div>

        <!-- Footer -->
        <div class="text-center mt-8 pt-4 border-t border-slate-800 text-xs text-slate-500">
            &copy; 2026 Powered by MgJen NFC Ecosystem
        </div>
    </div>

    <!-- Settings / Config Modal -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md rounded-2xl p-6 border border-slate-700 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-sliders mr-2"></i> Profile & Links Config</h3>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <form id="configForm" onsubmit="saveProfileConfig(event)" class="space-y-4">
                <!-- Profile Image URL / Upload -->
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Profile / Logo Image URL</label>
                    <input type="url" id="inputAvatar" placeholder="https://example.com/logo.jpg" 
                           class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 mb-2">
                    <div class="text-center my-1 text-xs text-slate-500">- သို့မဟုတ် (ဖုန်းမှ ပုံတင်ရန်) -</div>
                    <input type="file" id="inputImageFile" accept="image/*" onchange="handleImageSelection(event)"
                           class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">အမည် (Name)</label>
                    <input type="text" id="inputName" required placeholder="Mg Jen" 
                           class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">အလုပ်အကိုင် / Bio</label>
                    <input type="text" id="inputBio" required placeholder="Digital Creator & Developer" 
                           class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Facebook Profile Link</label>
                    <input type="url" id="inputFb" required placeholder="https://facebook.com/yourprofile" 
                           class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">TikTok Profile Link</label>
                    <input type="url" id="inputTiktok" required placeholder="https://tiktok.com/@yourprofile" 
                           class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">POS / Services App URL</label>
                    <input type="url" id="inputPosUrl" required placeholder="./pos-app.html" 
                           class="w-full bg-slate-900/60 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="toggleSettingsModal()" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-sm hover:bg-slate-700">ပိတ်မည်</button>
                    <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-500 shadow-md">သိမ်းဆည်းမည်</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Architecture & State Management -->
    <script>
        const DEFAULT_CONFIG = {
            name: "Mg Jen",
            bio: "Digital Creator & Developer",
            avatarUrl: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400",
            fbUrl: "https://facebook.com",
            tiktokUrl: "https://tiktok.com",
            posUrl: "./pos-app.html"
        };

        let selectedFileBase64 = null;

        // Load & Apply Configuration on Startup
        function loadConfig() {
            const savedConfig = JSON.parse(localStorage.getItem('nfc_profile_config')) || DEFAULT_CONFIG;
            
            document.getElementById('profileName').textContent = savedConfig.name;
            document.getElementById('profileBio').textContent = savedConfig.bio;
            document.getElementById('profileImage').src = savedConfig.avatarUrl;
            document.getElementById('fbLink').href = savedConfig.fbUrl;
            document.getElementById('tiktokLink').href = savedConfig.tiktokUrl;
            
            document.getElementById('inputName').value = savedConfig.name;
            document.getElementById('inputBio').value = savedConfig.bio;
            document.getElementById('inputAvatar').value = savedConfig.avatarUrl.startsWith('data:') ? '' : savedConfig.avatarUrl;
            document.getElementById('inputFb').value = savedConfig.fbUrl;
            document.getElementById('inputTiktok').value = savedConfig.tiktokUrl;
            document.getElementById('inputPosUrl').value = savedConfig.posUrl;
            
            selectedFileBase64 = null;
        }

        // Handle image selection, resize using Canvas to prevent localStorage quota overflow
        function handleImageSelection(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300;
                    const MAX_HEIGHT = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Compress to JPEG with 0.8 quality
                    selectedFileBase64 = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('inputAvatar').value = "";
                    showToast("ပုံကို အောင်မြင်စွာ ပြင်ဆင်ပြီးပါပြီ။ 'သိမ်းဆည်းမည်' ကိုနှိပ်ပါ။", "bg-blue-600");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function toggleSettingsModal() {
            const modal = document.getElementById('settingsModal');
            modal.classList.toggle('hidden');
        }

        async function saveProfileConfig(event) {
            event.preventDefault();
            
            const savedConfig = JSON.parse(localStorage.getItem('nfc_profile_config')) || DEFAULT_CONFIG;
            const urlInput = document.getElementById('inputAvatar').value.trim();
            
            let finalAvatar = savedConfig.avatarUrl;
            if (selectedFileBase64) {
                finalAvatar = selectedFileBase64;
            } else if (urlInput !== "") {
                finalAvatar = urlInput;
            }

            const newConfig = {
                name: document.getElementById('inputName').value.trim(),
                bio: document.getElementById('inputBio').value.trim(),
                avatarUrl: finalAvatar,
                fbUrl: document.getElementById('inputFb').value.trim(),
                tiktokUrl: document.getElementById('inputTiktok'.trim()) ? document.getElementById('inputTiktok').value.trim() : document.getElementById('inputTiktok').value.trim(),
                posUrl: document.getElementById('inputPosUrl').value.trim()
            };

            try {
                localStorage.setItem('nfc_profile_config', JSON.stringify(newConfig));
                loadConfig();
                toggleSettingsModal();
                showToast("အချက်အလက်များ အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ။", "bg-emerald-600");
            } catch (error) {
                console.error("Storage Error:", error);
                showToast("သိမ်းဆည်း၍မရပါ (ပုံအရွယ်အစား ကြီးလွန်းနေပါသည်)", "bg-rose-600");
            }
        }

        function showToast(message, bgColor = "bg-emerald-600") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            
            toast.className = `fixed top-5 right-5 z-50 transform transition-all duration-300 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2 border ${bgColor}`;
            toastMsg.textContent = message;
            
            toast.classList.remove('translate-x-full', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
            }, 3000);
        }

        function navigateToPOS() {
            const savedConfig = JSON.parse(localStorage.getItem('nfc_profile_config')) || DEFAULT_CONFIG;
            window.location.href = savedConfig.posUrl;
        }

        document.addEventListener('DOMContentLoaded', loadConfig);
    </script>
</body>
</html>
