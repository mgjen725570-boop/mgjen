<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မောင်ဂျမ်းစတူဒီယိုနှင့် မိတ္တူလုပ်ငန်း - User App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase App (Core) SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Firebase Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body { font-family: 'Padauk', sans-serif; }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #0f172a;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex justify-center">

    <div class="app-container flex flex-col relative border-x border-slate-800">

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center space-y-3">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-blue-500"></i>
            <p class="text-xs text-slate-300 font-semibold">ဆိုင်မှ အချက်အလက်များကို ရယူနေပါသည်...</p>
        </div>

        <!-- Notification Toast (Admin Acceptance Alert) -->
        <div id="notificationToast" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center gap-2 border border-emerald-400 max-w-[90%]">
            <i class="fa-solid fa-circle-check text-base"></i>
            <span id="toastMessage">သင့်အော်ဒါကို ဆိုင်မှ အတည်ပြုလက်ခံလိုက်ပါပြီ။</span>
        </div>

        <!-- App Header / Shop Banner -->
        <header class="bg-slate-900 border-b border-slate-800 px-4 py-3.5 shadow-md sticky top-0 z-40 flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <!-- MJ Logo Circle -->
                <div class="w-9 h-9 bg-blue-600 text-white font-bold rounded-full flex items-center justify-center text-xs shadow-inner border border-blue-400">
                    MJ
                </div>
                <div>
                    <h1 id="shopNameBanner" class="text-xs font-bold text-white tracking-wide">မောင်ဂျမ်းစတူဒီယိုနှင့် မိတ္တူလုပ်ငန်း</h1>
                    <p id="shopAddressBanner" class="text-[9px] text-slate-400 truncate max-w-[180px]">လမ်းမတော်၊ ရန်ကုန်မြို့။</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- My Orders Button -->
                <button onclick="openMyOrdersModal()" class="bg-blue-600/20 border border-blue-500/40 text-blue-400 hover:bg-blue-600 hover:text-white px-2.5 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1 transition">
                    <i class="fa-solid fa-clock-rotate-left"></i> စာရင်း
                </button>
                <!-- Direct Phone Call Button -->
                <a id="directCallBtn" href="tel:09123456789" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-xl text-xs font-semibold flex items-center justify-center shadow transition">
                    <i class="fa-solid fa-phone-volume"></i>
                </a>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 p-3 space-y-3 overflow-y-auto pb-16">
            
            <!-- Category Filter Tabs -->
            <div class="flex items-center space-x-1.5 overflow-x-auto pb-1 no-scrollbar" id="categoryTabs">
                <!-- Dynamically Rendered Categories -->
            </div>

            <!-- Products Grid (5 items per row) -->
            <div class="grid grid-cols-5 gap-1.5" id="userItemsContainer">
                <!-- Items loaded from Firebase -->
            </div>
        </main>

        <!-- Order Modal -->
        <div id="itemDetailModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-2xl relative">
                <button onclick="closeItemModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
                
                <div class="w-full h-32 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center overflow-hidden" id="modalItemImgContainer">
                    <!-- Modal Image -->
                </div>

                <div>
                    <span id="modalItemCategory" class="text-[9px] bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded font-semibold">Category</span>
                    <h3 id="modalItemName" class="text-sm font-bold text-white mt-1">ပစ္စည်းအမည်</h3>
                    <p id="modalItemPrice" class="text-sm font-bold text-emerald-400 mt-0.5">0 Ks</p>
                </div>

                <div class="border-t border-slate-800 pt-2 space-y-2">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">ဝယ်ယူသူ အမည်</label>
                        <input type="text" id="orderCustName" placeholder="ဥပမာ- ကိုအောင်" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">ဖုန်းနံပါတ် (ဥပမာ - 09XXXXXXXXX)</label>
                        <input type="text" id="orderCustPhone" placeholder="09XXXXXXXXX" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">နေရပ်လိပ်စာ (အသေးစိတ်ဖြည့်ပါ)</label>
                        <textarea id="orderCustAddress" rows="2" placeholder="အိမ်နံပါတ်၊ လမ်း၊ မြို့နယ်..." class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500"></textarea>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5">အရေအတွက်</label>
                        <input type="number" id="orderQty" value="1" min="1" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                    </div>

                    <!-- Validation Error Box -->
                    <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500/40 text-red-400 text-[10px] p-2 rounded-lg"></div>

                    <button onclick="validateAndSubmitOrder()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-xs transition shadow-lg flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-check"></i> အော်ဒါအတည်ပြုမည်
                    </button>
                </div>
            </div>
        </div>

        <!-- My Orders History Modal -->
        <div id="myOrdersModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50 backdrop-blur-sm">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-2xl relative max-h-[80vh] flex flex-col">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h3 class="text-sm font-bold text-white"><i class="fa-solid fa-list-check text-blue-400 me-1.5"></i> ကျွန်ုပ်၏ အော်ဒါစာရင်းများ</h3>
                    <button onclick="closeMyOrdersModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-base"></i></button>
                </div>

                <div class="mb-2">
                    <label class="text-[10px] text-slate-400 block mb-1">သင့်ဖုန်းနံပါတ်ဖြင့် စာရင်းရှာရန်</label>
                    <div class="flex gap-1.5">
                        <input type="text" id="searchPhoneInput" placeholder="09XXXXXXXXX" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
                        <button onclick="fetchMyOrders()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">ရှာရန်</button>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="myOrdersListContainer">
                    <p class="text-center text-xs text-slate-500 py-8">ဖုန်းနံပါတ်ထည့်၍ ရှာဖွေပါ။</p>
                </div>
            </div>
        </div>

        <!-- App Footer Nav -->
        <footer class="bg-slate-900 border-t border-slate-800 text-center py-2 text-[10px] text-slate-500 mt-auto">
            &copy; 2026 မောင်ဂျမ်းစတူဒီယိုနှင့် မိတ္တူလုပ်ငန်း
        </footer>
    </div>

    <!-- Firebase Logic & App Scripts -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDyjFwJDMSviMlSdDZF4K12Sji_yHkpXDE",
            authDomain: "mgjem-392c7.firebaseapp.com",
            projectId: "mgjem-392c7",
            storageBucket: "mgjem-392c7.firebasestorage.app",
            messagingSenderId: "543296449387",
            appId: "1:543296449387:web:daf35021f9e2fd05f1fa2e",
            measurementId: "G-CCSVBD912S"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let items = [];
        let selectedCategory = 'All';
        let activeItem = null;
        let lastNotifiedOrderIds = JSON.parse(localStorage.getItem('notified_orders') || '[]');

        document.addEventListener('DOMContentLoaded', () => {
            loadShopInfo();
            loadItems();
            initOrderRealtimeListener();
        });

        function loadShopInfo() {
            db.collection("settings").doc("shop").get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('shopNameBanner').innerText = data.name || "မောင်ဂျမ်းစတူဒီယိုနှင့် မိတ္တူလုပ်ငန်း";
                    document.getElementById('shopAddressBanner').innerText = data.address || "";
                    if(data.phone) {
                        document.getElementById('directCallBtn').href = `tel:${data.phone.split(',')[0].trim()}`;
                    }
                }
            });
        }

        function loadItems() {
            db.collection("items").onSnapshot((snapshot) => {
                items = [];
                snapshot.forEach((doc) => {
                    items.push({ id: doc.id, ...doc.data() });
                });
                renderCategoryTabs();
                renderUserItems();
                document.getElementById('loadingOverlay').style.display = 'none';
            }, (error) => {
                console.error("Error loading items: ", error);
                document.getElementById('loadingOverlay').style.display = 'none';
            });
        }

        // Admin မှ အော်ဒါအတည်ပြုလိုက်သည်ကို စောင့်ကြည့်ရန် Real-time Listener
        function initOrderRealtimeListener() {
            db.collection("customerOrders").onSnapshot((snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "modified") {
                        const data = change.doc.data();
                        const orderId = change.doc.id;
                        // အကယ်၍ အခြေအနေက Approved ဖြစ်သွားပြီး ယခင်က အသိပေးပြီးသား မဟုတ်လျှင်
                        if (data.status === "Approved" && !lastNotifiedOrderIds.includes(orderId)) {
                            showNotificationToast(`အော်ဒါ (${data.itemName}) ကို ဆိုင်မှ အတည်ပြုလက်ခံလိုက်ပါပြီ။`);
                            lastNotifiedOrderIds.push(orderId);
                            localStorage.setItem('notified_orders', JSON.stringify(lastNotifiedOrderIds));
                            
                            // အကယ်၍ My Orders ဖွင့်ထားလျှင် စာရင်းကိုပါ Update လုပ်ပေးမည်
                            const searchPhone = document.getElementById('searchPhoneInput').value.trim();
                            if(searchPhone && searchPhone === data.customerPhone) {
                                fetchMyOrders();
                            }
                        }
                    }
                });
            });
        }

        function showNotificationToast(msg) {
            const toast = document.getElementById('notificationToast');
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 6000);
        }

        function renderCategoryTabs() {
            const categories = ['All', 'Photo', 'Copy', 'Frame', 'Invitation', 'Other'];
            const labels = { 'All': 'အားလုံး', 'Photo': 'ဓာတ်ပုံ', 'Copy': 'မိတ္တူ', 'Frame': 'ဘောင်', 'Invitation': 'ဖိတ်စာ', 'Other': 'အခြား' };
            const container = document.getElementById('categoryTabs');
            
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="px-2.5 py-1 rounded-lg text-[10px] font-semibold whitespace-nowrap transition ${selectedCategory === cat ? 'bg-blue-600 text-white shadow' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:bg-slate-800'}">
                    ${labels[cat] || cat}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            renderCategoryTabs();
            renderUserItems();
        }

        function renderUserItems() {
            const container = document.getElementById('userItemsContainer');
            const filtered = selectedCategory === 'All' ? items : items.filter(i => i.category === selectedCategory);

            if(filtered.length === 0) {
                container.innerHTML = `<div class="col-span-5 text-center py-12 text-slate-500 text-[11px]">ဤအမျိုးအစားတွင် ပစ္စည်းမရှိသေးပါ။</div>`;
                return;
            }

            container.innerHTML = filtered.map(item => `
                <div onclick="openItemModal('${item.id}')" class="bg-slate-900 border border-slate-800 hover:border-blue-500 rounded-lg p-1.5 cursor-pointer flex flex-col justify-between transition shadow-sm group">
                    <div class="w-full h-16 bg-slate-950 rounded p-1 mb-1 border border-slate-800 flex items-center justify-center overflow-hidden">
                        ${item.image 
                            ? `<img src="${item.image}" class="max-w-full max-h-full object-contain">` 
                            : `<i class="fa-solid fa-image text-xl text-slate-700"></i>`}
                    </div>
                    <div class="space-y-0.5">
                        <h4 class="text-[9px] font-bold text-slate-200 truncate">${item.name}</h4>
                        <p class="text-[9px] font-bold text-emerald-400">${item.price.toLocaleString()} Ks</p>
                    </div>
                </div>
            `).join('');
        }

        function openItemModal(itemId) {
            activeItem = items.find(i => i.id === itemId);
            if(!activeItem) return;

            document.getElementById('modalItemName').innerText = activeItem.name;
            document.getElementById('modalItemPrice').innerText = `${activeItem.price.toLocaleString()} Ks`;
            document.getElementById('modalItemCategory').innerText = activeItem.category || 'General';
            
            const imgContainer = document.getElementById('modalItemImgContainer');
            if(activeItem.image) {
                imgContainer.innerHTML = `<img src="${activeItem.image}" class="max-w-full max-h-full object-contain">`;
            } else {
                imgContainer.innerHTML = `<i class="fa-solid fa-image text-3xl text-slate-700"></i>`;
            }

            document.getElementById('orderQty').value = 1;
            document.getElementById('orderCustName').value = '';
            document.getElementById('orderCustPhone').value = '';
            document.getElementById('orderCustAddress').value = '';
            document.getElementById('errorMessage').classList.add('hidden');

            const modal = document.getElementById('itemDetailModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeItemModal() {
            document.getElementById('itemDetailModal').classList.add('hidden');
            document.getElementById('itemDetailModal').classList.remove('flex');
            activeItem = null;
        }

        async function validateAndSubmitOrder() {
            const name = document.getElementById('orderCustName').value.trim();
            const phone = document.getElementById('orderCustPhone').value.trim();
            const address = document.getElementById('orderCustAddress').value.trim();
            const qty = parseInt(document.getElementById('orderQty').value) || 1;
            const errorBox = document.getElementById('errorMessage');

            errorBox.classList.add('hidden');

            if (!name || !phone || !address) {
                showError("ကျေးဇူးပြု၍ အမည်၊ ဖုန်းနံပါတ်နှင့် နေရပ်လိပ်စာ အပြည့်အစုံ ဖြည့်သွင်းပါ။");
                return;
            }

            const phoneRegex = /^(09|\+959)\d{7,9}$/;
            if (!phoneRegex.test(phone)) {
                showError("ထည့်သွင်းထားသော ဖုန်းနံပါတ် မမှန်ကန်ပါ။ (ဥပမာ - 09XXXXXXXXX)");
                return;
            }

            if (address.length < 10) {
                showError("နေရပ်လိပ်စာ အချက်အလက် အလွန်တိုနေပါသည်။ အိမ်နံပါတ်၊ လမ်းနှင့် မြို့နယ်အမည် အပြည့်အစုံ ထည့်ပါ။");
                return;
            }

            try {
                const isValidAddress = await verifyAddressWithGoogleMaps(address);
                if (!isValidAddress) {
                    showError("ဖြည့်စုံထားသော နေရပ်လိပ်စာကို Google Maps တွင် ရှာမတွေ့ပါ။ ကျေးဇူးပြု၍ လိပ်စာကို သေချာစွာ ပြန်လည်စစ်ဆေးပါ။");
                    return;
                }
            } catch (e) {
                console.warn("Maps API check skipped:", e);
            }

            const orderData = {
                customerName: name,
                customerPhone: phone,
                customerAddress: address,
                itemName: activeItem.name,
                qty: qty,
                totalPrice: activeItem.price * qty,
                currency: "Ks",
                date: new Date().toISOString().split('T')[0],
                status: "Pending", // Pending သို့မဟုတ် Approved
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("customerOrders").add(orderData).then(() => {
                alert('အော်ဒါတင်ခြင်း အောင်မြင်ပါသည်။ ဆိုင်မှ အမြန်ဆုံး ဆက်သွယ်ပေးပါမည်။');
                closeItemModal();
            }).catch(error => {
                console.error("Order error: ", error);
                showError("အော်ဒါတင်ရာတွင် အမှားအယွင်းရှိပါသည်။");
            });
        }

        async function verifyAddressWithGoogleMaps(address) {
            const encodedAddress = encodeURIComponent(address + ", Myanmar");
            const url = `https://maps.googleapis.com/maps/api/geocode/json?address=${encodedAddress}&key=AIzaSyDyjFwJDMSviMlSdDZF4K12Sji_yHkpXDE`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.status === "OK" && data.results.length > 0) {
                    return true;
                }
                return false;
            } catch (err) {
                return true;
            }
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorMessage');
            errorBox.innerText = msg;
            errorBox.classList.remove('hidden');
        }

        // My Orders Modal Control
        function openMyOrdersModal() {
            document.getElementById('myOrdersModal').classList.remove('hidden');
            document.getElementById('myOrdersModal').classList.add('flex');
        }

        function closeMyOrdersModal() {
            document.getElementById('myOrdersModal').classList.add('hidden');
            document.getElementById('myOrdersModal').classList.remove('flex');
        }

        function fetchMyOrders() {
            const phone = document.getElementById('searchPhoneInput').value.trim();
            const container = document.getElementById('myOrdersListContainer');

            if(!phone) {
                alert('ကျေးဇူးပြု၍ ဖုန်းနံပါတ် ထည့်သွင်းပါ။');
                return;
            }

            container.innerHTML = `<p class="text-center text-xs text-slate-400 py-4">ရှာဖွေနေသည်...</p>`;

            db.collection("customerOrders").where("customerPhone", "==", phone).get().then((querySnapshot) => {
                if(querySnapshot.empty) {
                    container.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">ဤဖုန်းနံပါတ်ဖြင့် အော်ဒါတင်ထားမှု မရှိသေးပါ။</p>`;
                    return;
                }

                let html = '';
                querySnapshot.forEach((doc) => {
                    const order = doc.data();
                    const statusText = order.status === "Approved" ? '<span class="text-emerald-400 font-bold">လက်ခံပြီး (Approved)</span>' : '<span class="text-amber-400">စစ်ဆေးဆဲ (Pending)</span>';
                    
                    html += `
                        <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl space-y-1 text-xs">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-slate-200">${order.itemName} (x${order.qty})</span>
                                <span class="text-[10px]">${statusText}</span>
                            </div>
                            <div class="flex justify-between text-[10px] text-slate-400">
                                <span>ကျသင့်ငွေ: ${order.totalPrice.toLocaleString()} Ks</span>
                                <span>ရက်စွဲ: ${order.date || '-'}</span>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }).catch((error) => {
                console.error("Error fetching orders:", error);
                container.innerHTML = `<p class="text-center text-xs text-red-400 py-4">အချက်အလက်ရယူရာတွင် အမှားအယွင်းရှိပါသည်။</p>`;
            });
        }
    </script>
</body>
</html>
