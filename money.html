<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Payroll Calculator</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Pyidaungsu', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .payroll-card { 
            background: white; width: 100%; max-width: 450px; padding: 25px; 
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; color: #666; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; }
        input:focus { border-color: var(--accent); }

        .analysis-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; /* ကော်လံ ၃ ခုပြောင်းလဲထားသည် */
            gap: 8px; 
            background: #f8f9fa; 
            padding: 12px; 
            border-radius: 12px; 
            margin: 15px 0; 
        }
        .analysis-item { text-align: center; border-right: 1px solid #eee; }
        .analysis-item:last-child { border-right: none; }
        .analysis-item span { display: block; font-size: 10px; color: #888; margin-bottom: 5px; }
        .analysis-item b { font-size: 14px; color: var(--primary); }

        .net-pay-box { background: var(--accent); color: white; padding: 15px; border-radius: 12px; text-align: center; margin-top: 10px; }
        .net-pay-box h1 { margin: 5px 0; font-size: 28px; }

        .btn-save { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; }
        .history-item { background: white; padding: 12px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div class="payroll-card">
    <h2>Payroll System Pro</h2>
    
    <div style="display: flex; gap: 10px;">
        <div class="input-group" style="flex: 1;">
            <label>ငွေကြေး</label>
            <select id="currency" onchange="doCalc()">
                <option value="THB">Thai Baht (฿)</option>
                <option value="MMK">Myanmar Kyat (Ks)</option>
            </select>
        </div>
        <div class="input-group" style="flex: 1;">
            <label>ဝန်ထမ်းအမျိုးအစား</label>
            <select id="empType" onchange="toggleType(); doCalc();">
                <option value="monthly">လခစား</option>
                <option value="daily">နေ့စား</option>
            </select>
        </div>
    </div>

    <div class="input-group" id="monthlySalaryInput">
        <label>အခြေခံလစာ (Monthly Salary)</label>
        <input type="number" id="salary" placeholder="လစာရိုက်ပါ" oninput="doCalc()">
    </div>

    <div class="input-group" id="dailyRateInput" style="display:none;">
        <label>တစ်ရက်နေ့စားခ (Daily Rate)</label>
        <input type="number" id="manualDailyRate" placeholder="နေ့စားခရိုက်ပါ" oninput="doCalc()">
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="input-group" style="flex: 1;">
            <label>အလုပ်လုပ်ရက်</label>
            <input type="number" id="days" value="26" step="0.5" oninput="doCalc()">
        </div>
        <div class="input-group" style="flex: 1;">
            <label>ထမင်းဖိုး (တစ်နေ့)</label>
            <input type="number" id="mealRate" placeholder="၄၀" oninput="doCalc()">
        </div>
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="input-group" style="flex: 1;">
            <label>OT ၁ နာရီခ</label>
            <input type="number" id="otRateInput" placeholder="၆၄" oninput="doCalc()">
        </div>
        <div class="input-group" style="flex: 1.2;">
            <label>OT နာရီ + မိနစ်</label>
            <div style="display: flex; gap: 5px;">
                <input type="number" id="otHours" placeholder="နာရီ" oninput="doCalc()">
                <input type="number" id="otMins" placeholder="မိနစ်" oninput="doCalc()" min="0" max="59">
            </div>
        </div>
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="input-group" style="flex: 1;">
            <label>ပတ်ကန်ဆန်ခွန် (SSB)</label>
            <input type="number" id="ssb" placeholder="နှုတ်ငွေ" oninput="doCalc()">
        </div>
        <div class="input-group" style="flex: 1;">
            <label>တခြားနုတ်ငွေ</label>
            <input type="number" id="minus" placeholder="အမောက်" oninput="doCalc()">
        </div>
    </div>

    <div class="analysis-grid">
        <div class="analysis-item">
            <span>ထမင်းဖိုးစုစုပေါင်း</span>
            <b id="mealTotal">0</b>
        </div>
        <div class="analysis-item">
            <span>တစ်နေ့လုပ်အားခ</span>
            <b id="dRate">0</b>
        </div>
        <div class="analysis-item">
            <span>OT စုစုပေါင်း</span>
            <b id="otTotal">0</b>
        </div>
    </div>

    <div class="net-pay-box">
        <small id="netPayLabel">အသားတင်လစာ</small>
        <h1><span id="final">0</span> <small id="currLabel" style="font-size: 16px;">฿</small></h1>
    </div>

    <button class="btn-save" onclick="saveToHistory()">မှတ်တမ်းသိမ်းဆည်းမည်</button>
</div>

<div style="width: 100%; max-width: 450px; margin-top: 20px;">
    <h3 style="color: var(--primary);">တွက်ချက်မှုမှတ်တမ်း</h3>
    <div id="historyList"></div>
</div>

<script>
    function toggleType() {
        const type = document.getElementById('empType').value;
        document.getElementById('monthlySalaryInput').style.display = type === 'monthly' ? 'block' : 'none';
        document.getElementById('dailyRateInput').style.display = type === 'daily' ? 'block' : 'none';
    }

    function doCalc() {
        const type = document.getElementById('empType').value;
        const salary = parseFloat(document.getElementById('salary').value) || 0;
        const manualDaily = parseFloat(document.getElementById('manualDailyRate').value) || 0;
        const days = parseFloat(document.getElementById('days').value) || 0;
        const mealRate = parseFloat(document.getElementById('mealRate').value) || 0;
        
        const otHours = parseFloat(document.getElementById('otHours').value) || 0;
        const otMins = parseFloat(document.getElementById('otMins').value) || 0;
        const otRateInput = parseFloat(document.getElementById('otRateInput').value) || 0;
        
        const ssb = parseFloat(document.getElementById('ssb').value) || 0;
        const minus = parseFloat(document.getElementById('minus').value) || 0;
        const curr = document.getElementById('currency').value;

        // ၁။ နေ့စားခနှုန်းထားတွက်ချက်ခြင်း
        let dailyRate = 0;
        let baseIncome = 0;

        if (type === 'monthly') {
            dailyRate = salary / 26; // လခစားအတွက် ပုံမှန် ၂၆ ရက်ဖြင့် တည်စားသည်
            baseIncome = salary;
        } else {
            dailyRate = manualDaily;
            baseIncome = dailyRate * days;
        }
        document.getElementById('dRate').innerText = Math.round(dailyRate).toLocaleString();

        // ၂။ ထမင်းဖိုးစုစုပေါင်း
        const totalMeal = mealRate * days;
        document.getElementById('mealTotal').innerText = Math.round(totalMeal).toLocaleString();

        // ၃။ OT စုစုပေါင်း (နာရီ + မိနစ်)
        const totalOTTime = otHours + (otMins / 60);
        const totalOTPay = totalOTTime * otRateInput;
        document.getElementById('otTotal').innerText = Math.round(totalOTPay).toLocaleString();

        // ၄။ စုစုပေါင်း အသားတင်လစာ
        const netPay = (baseIncome + totalMeal + totalOTPay) - (ssb + minus);
        
        document.getElementById('final').innerText = Math.round(netPay).toLocaleString();
        document.getElementById('currLabel').innerText = curr === "THB" ? "฿" : "Ks";
    }

    function saveToHistory() {
        const finalAmt = document.getElementById('final').innerText;
        const curr = document.getElementById('currLabel').innerText;
        if(finalAmt == "0") return;

        const date = new Date().toLocaleDateString();
        const historyList = document.getElementById('historyList');
        
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
            <div>
                <small style="color: #888;">${date}</small>
                <div style="font-weight: bold;">အသားတင်လစာ</div>
            </div>
            <div style="color: var(--accent); font-weight: bold; font-size: 18px;">
                ${finalAmt} ${curr}
            </div>
        `;
        
        historyList.prepend(item);
    }

    doCalc();
</script>

</body>
</html>
