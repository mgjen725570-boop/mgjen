<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Pro Max</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Pyidaungsu', sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .payroll-card { 
            background: white; width: 100%; max-width: 450px; padding: 25px; 
            border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative;
        }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; width: 100%; max-width: 450px; }
        .lang-bar { display: flex; gap: 8px; }
        .lang-btn { cursor: pointer; padding: 5px 10px; border-radius: 5px; border: 1px solid #ddd; background: white; font-size: 12px; }
        .lang-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .calc-toggle { cursor: pointer; font-size: 20px; background: white; border: 1px solid #ddd; padding: 5px 10px; border-radius: 8px; }

        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        .input-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-size: 13px; color: #666; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; }

        .analysis-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; background: #f8f9fa; padding: 12px; border-radius: 12px; margin: 15px 0; }
        .analysis-item { text-align: center; }
        .analysis-item span { display: block; font-size: 11px; color: #888; }
        .analysis-item b { font-size: 14px; color: var(--primary); }

        .net-pay-box { background: var(--accent); color: white; padding: 15px; border-radius: 12px; text-align: center; }
        .net-pay-box h1 { margin: 5px 0; font-size: 28px; }

        .btn-save { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; }

        /* Calculator Styles */
        .calc-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 1000; justify-content: center; align-items: center; }
        .calc-box { background: #222; padding: 20px; border-radius: 20px; width: 280px; }
        .calc-display { width: 100%; height: 50px; background: #333; color: white; border: none; border-radius: 10px; margin-bottom: 15px; text-align: right; padding: 10px; font-size: 24px; box-sizing: border-box; }
        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { padding: 15px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; background: #444; color: white; }
        .calc-btn.op { background: #f39c12; }
        .calc-btn.eq { background: var(--accent); grid-column: span 2; }
        .calc-btn.clr { background: #e74c3c; }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="lang-bar">
        <div class="lang-btn active" onclick="changeLang('my', this)">မြန်မာ</div>
        <div class="lang-btn" onclick="changeLang('cn', this)">中文</div>
        <div class="lang-btn" onclick="changeLang('en', this)">EN</div>
    </div>
    <button class="calc-toggle" onclick="toggleCalc(true)">🧮</button>
</div>

<div class="payroll-card">
    <h2 id="t-title">Payroll System Pro</h2>
    
    <div style="display: flex; gap: 10px;">
        <div class="input-group" style="flex: 1;">
            <label id="t-curr-label">ငွေကြေး</label>
            <select id="currency" onchange="doCalc()">
                <option value="THB">Thai Baht (฿)</option>
                <option value="MMK">Myanmar Kyat (Ks)</option>
                <option value="CNY">Chinese Yuan (¥)</option>
            </select>
        </div>
        <div class="input-group" style="flex: 1;">
            <label id="t-type-label">အမျိုးအစား</label>
            <select id="empType" onchange="toggleInputs(); doCalc();">
                <option value="monthly" id="t-opt-monthly">လခစား</option>
                <option value="daily" id="t-opt-daily">နေ့စား</option>
            </select>
        </div>
    </div>

    <div id="monthlySalaryInput" class="input-group">
        <label id="t-salary-label">အခြေခံလစာ</label>
        <input type="number" id="salary" placeholder="လစာရိုက်ပါ" oninput="doCalc()">
    </div>

    <div id="dailyRateInput" class="input-group" style="display:none;">
        <label id="t-daily-label">တစ်ရက်နေ့စားခ</label>
        <input type="number" id="manualDailyRate" placeholder="နေ့စားခရိုက်ပါ" oninput="doCalc()">
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="input-group" style="flex: 1;">
            <label id="t-days-label">အလုပ်လုပ်ရက်</label>
            <input type="number" id="days" value="26" step="0.5" oninput="doCalc()">
        </div>
        <div class="input-group" style="flex: 1;">
            <label id="t-extra-label">အပိုငွေ/ဆုကြေး</label>
            <input type="number" id="extra" placeholder="အပိုရငွေ" oninput="doCalc()">
        </div>
    </div>

    <div style="display: flex; gap: 10px;">
        <div class="input-group" style="flex: 1;">
            <label id="t-otrate-label">OT ၁ နာရီခ</label>
            <input type="number" id="otRateInput" placeholder="ဥပမာ ၆၄" oninput="doCalc()">
        </div>
        <div class="input-group" style="flex: 1.2;">
            <label id="t-ottime-label">OT (နာရီ + မိနစ်)</label>
            <div style="display: flex; gap: 5px;">
                <input type="number" id="otHours" placeholder="Hr" oninput="doCalc()">
                <input type="number" id="otMins" placeholder="Min" oninput="doCalc()">
            </div>
        </div>
    </div>

    <div class="input-group">
        <label id="t-minus-label">နုတ်ငွေ (ဥပမာ-ပတ်ကန်ဆန်ခွန်)</label>
        <input type="number" id="minus" placeholder="နှုတ်ရမည့်ပမာဏ" oninput="doCalc()">
    </div>

    <div class="analysis-grid">
        <div class="analysis-item">
            <span id="t-drate-show">တစ်နေ့လုပ်အားခ</span>
            <b id="dRate">0</b>
        </div>
        <div class="analysis-item">
            <span id="t-ottotal-show">OT စုစုပေါင်း</span>
            <b id="otTotal">0</b>
        </div>
        <div class="analysis-item">
            <span id="t-extra-show">အပိုငွေပေါင်း</span>
            <b id="extraShow">0</b>
        </div>
    </div>

    <div class="net-pay-box">
        <small id="t-netpay-label">စုစုပေါင်းရရှိငွေ</small>
        <h1><span id="final">0</span> <small id="currLabel">฿</small></h1>
    </div>

    <button class="btn-save" id="t-btn-save" onclick="saveToHistory()">မှတ်တမ်းသိမ်းမည်</button>
</div>

<div id="calcModal" class="calc-overlay">
    <div class="calc-box">
        <div style="display: flex; justify-content: space-between; color: white; margin-bottom: 10px;">
            <span>Calculator</span>
            <span style="cursor:pointer" onclick="toggleCalc(false)">✖</span>
        </div>
        <input type="text" id="calcDisplay" class="calc-display" readonly>
        <div class="calc-buttons">
            <button class="calc-btn clr" onclick="clearCalc()">C</button>
            <button class="calc-btn op" onclick="pressCalc('/')">÷</button>
            <button class="calc-btn op" onclick="pressCalc('*')">×</button>
            <button class="calc-btn op" onclick="backCalc()">⌫</button>
            <button class="calc-btn" onclick="pressCalc('7')">7</button>
            <button class="calc-btn" onclick="pressCalc('8')">8</button>
            <button class="calc-btn" onclick="pressCalc('9')">9</button>
            <button class="calc-btn op" onclick="pressCalc('-')">-</button>
            <button class="calc-btn" onclick="pressCalc('4')">4</button>
            <button class="calc-btn" onclick="pressCalc('5')">5</button>
            <button class="calc-btn" onclick="pressCalc('6')">6</button>
            <button class="calc-btn op" onclick="pressCalc('+')">+</button>
            <button class="calc-btn" onclick="pressCalc('1')">1</button>
            <button class="calc-btn" onclick="pressCalc('2')">2</button>
            <button class="calc-btn" onclick="pressCalc('3')">3</button>
            <button class="calc-btn eq" onclick="resultCalc()">=</button>
            <button class="calc-btn" style="grid-column: span 2;" onclick="pressCalc('0')">0</button>
            <button class="calc-btn" onclick="pressCalc('.')">.</button>
        </div>
    </div>
</div>

<script>
    const langData = {
        my: { title: "လစာတွက်စနစ် Pro", curr: "ငွေကြေး", type: "အမျိုးအစား", monthly: "လခစား", daily: "နေ့စား", salary: "အခြေခံလစာ", dailyrate: "တစ်ရက်နေ့စားခ", days: "အလုပ်လုပ်ရက်", extra: "အပိုငွေ/ဆုကြေး", otrate: "OT ၁ နာရီခ", ottime: "OT (နာရီ + မိနစ်)", minus: "နုတ်ငွေ", drate_sh: "တစ်နေ့လုပ်အားခ", ot_sh: "OT စုစုပေါင်း", extra_sh: "အပိုငွေပေါင်း", net: "စုစုပေါင်းရရှိငွေ", save: "မှတ်တမ်းသိမ်းမည်" },
        cn: { title: "工资计算器 Pro", curr: "货币", type: "类型", monthly: "月薪制", daily: "日薪制", salary: "基本工资", dailyrate: "日薪标准", days: "工作天数", extra: "奖金/津贴", otrate: "加班时薪", ottime: "加班 (小时+分)", minus: "扣除金额", drate_sh: "日薪计算", ot_sh: "加班费总计", extra_sh: "总奖金", net: "实发工资总額", save: "保存记录" },
        en: { title: "Payroll Pro Max", curr: "Currency", type: "Type", monthly: "Monthly", daily: "Daily", salary: "Basic Salary", dailyrate: "Daily Rate", days: "Work Days", extra: "Bonus/Extra", otrate: "OT Rate/Hr", ottime: "OT (Hr + Min)", minus: "Deduction", drate_sh: "Daily Rate", ot_sh: "Total OT", extra_sh: "Total Bonus", net: "Net Salary", save: "Save History" }
    };

    function toggleCalc(show) { document.getElementById('calcModal').style.display = show ? 'flex' : 'none'; }
    function pressCalc(v) { document.getElementById('calcDisplay').value += v; }
    function clearCalc() { document.getElementById('calcDisplay').value = ''; }
    function backCalc() { let v = document.getElementById('calcDisplay').value; document.getElementById('calcDisplay').value = v.slice(0,-1); }
    function resultCalc() { try { document.getElementById('calcDisplay').value = eval(document.getElementById('calcDisplay').value); } catch { document.getElementById('calcDisplay').value = 'Error'; } }

    function changeLang(lang, btn) {
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const d = langData[lang];
        document.getElementById('t-title').innerText = d.title;
        document.getElementById('t-curr-label').innerText = d.curr;
        document.getElementById('t-type-label').innerText = d.type;
        document.getElementById('t-opt-monthly').innerText = d.monthly;
        document.getElementById('t-opt-daily').innerText = d.daily;
        document.getElementById('t-salary-label').innerText = d.salary;
        document.getElementById('t-daily-label').innerText = d.dailyrate;
        document.getElementById('t-days-label').innerText = d.days;
        document.getElementById('t-extra-label').innerText = d.extra;
        document.getElementById('t-otrate-label').innerText = d.otrate;
        document.getElementById('t-ottime-label').innerText = d.ottime;
        document.getElementById('t-minus-label').innerText = d.minus;
        document.getElementById('t-drate-show').innerText = d.drate_sh;
        document.getElementById('t-ottotal-show').innerText = d.ot_sh;
        document.getElementById('t-extra-show').innerText = d.extra_sh;
        document.getElementById('t-netpay-label').innerText = d.net;
        document.getElementById('t-btn-save').innerText = d.save;
    }

    function toggleInputs() {
        const type = document.getElementById('empType').value;
        document.getElementById('monthlySalaryInput').style.display = type === 'monthly' ? 'block' : 'none';
        document.getElementById('dailyRateInput').style.display = type === 'daily' ? 'block' : 'none';
    }

    function doCalc() {
        const type = document.getElementById('empType').value;
        const salary = parseFloat(document.getElementById('salary').value) || 0;
        const manualDaily = parseFloat(document.getElementById('manualDailyRate').value) || 0;
        const days = parseFloat(document.getElementById('days').value) || 0;
        const extra = parseFloat(document.getElementById('extra').value) || 0;
        const otHours = parseFloat(document.getElementById('otHours').value) || 0;
        const otMins = parseFloat(document.getElementById('otMins').value) || 0;
        const otRateInput = parseFloat(document.getElementById('otRateInput').value) || 0;
        const minus = parseFloat(document.getElementById('minus').value) || 0;

        let dailyRate = (type === 'monthly') ? (salary / 26) : manualDaily;
        let basePay = dailyRate * days;

        document.getElementById('dRate').innerText = Math.round(dailyRate).toLocaleString();
        const totalOTPay = (otHours + (otMins / 60)) * otRateInput;
        document.getElementById('otTotal').innerText = Math.round(totalOTPay).toLocaleString();
        document.getElementById('extraShow').innerText = extra.toLocaleString();

        const netPay = (basePay + totalOTPay + extra) - minus;
        document.getElementById('final').innerText = Math.round(netPay).toLocaleString();
        
        // ငွေကြေးသင်္ကေတ ပြောင်းလဲခြင်း
        const curr = document.getElementById('currency').value;
        let symbol = "฿";
        if (curr === "MMK") symbol = "Ks";
        if (curr === "CNY") symbol = "¥";
        document.getElementById('currLabel').innerText = symbol;
    }

    function saveToHistory() {
        const amt = document.getElementById('final').innerText;
        if(amt !== "0") alert("သိမ်းဆည်းပြီးပါပြီ- " + amt);
    }
</script>
</body>
</html>
